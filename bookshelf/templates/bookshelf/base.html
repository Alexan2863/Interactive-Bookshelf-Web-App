<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Bookshelf{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Cutive&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }

      body {
          font-family: 'Cutive', serif;
          line-height: 1.6;
          color: #333;
          background-color: #f4f4f4;
      }

      .container {
          max-width: 1200px;
          margin: 0 auto;
          padding: 0 20px;
      }

      main {
          min-height: calc(100vh - 200px);
          padding: 40px 0;
      }

      {% block extra_css %}{% endblock %}
    </style>
  </head>
  <body>
    {% include 'bookshelf/includes/nav.html' %}

    <main>
      <div class="container">{% block content %}{% endblock %}</div>
    </main>

    {% include 'bookshelf/includes/footer.html' %}
  </body>
</html>
